server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 不暴露 nginx 版本号
    server_tokens off;

    # ===== 安全响应头 =====
    # 注意：add_header 的继承规则是「location 里只要出现一个 add_header，
    # server 级的全部失效」。因此下面这些头只写在 server 级，
    # 所有 location 的缓存一律用 expires 指令实现（expires 不影响继承）。
    # CSP 说明：
    #   'unsafe-inline'  Docusaurus 内联引导脚本
    #   'unsafe-eval'    Brython 在主线程编译执行 Python（插件的硬需求）
    #   'wasm-unsafe-eval' Pyodide / Yaegi 的 WebAssembly 实例化
    #   connect-src 'self'  页面与演练场 Worker 都只能访问本站，
    #                       封掉向第三方（PyPI 等）发起的网络请求
    # 本站所有资源自托管，无第三方 CDN/分析脚本，CSP 可收紧到 'self'
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # 明文 HTTP 响应按规范忽略此头，仅 HTTPS 生效；自托管如经反代终结 TLS 也不受影响
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # gzip 压缩（wasm 必须在列：Go 演练场的 main.wasm 37MB → 压后约 9MB）
    gzip on;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;

    # 带 hash 的静态资源长缓存
    location /assets/ {
        expires 1y;
    }

    # 演练场运行时（Pyodide / Go WASM / Monaco）体积大且很少变，适度缓存
    location ~ ^/(pyodide|go-wasm|monaco)/ {
        # nginx 默认 mime.types 没有 .mjs，会按 octet-stream 下发，
        # 浏览器对 ES Module 脚本强制校验 MIME，Pyodide 会直接加载失败。
        # 注意：location 内的 types 会整体替换继承的类型表，这里要把
        # 这三个目录下出现的后缀全部列全
        types {
            text/javascript js mjs;
            application/wasm wasm;
            application/json json;
            text/css css;
            font/ttf ttf;
            application/zip zip;
        }
        default_type application/octet-stream;
        expires 7d;
    }

    # 图片等静态文件适度缓存
    location /img/ {
        expires 7d;
    }

    # HTML 不缓存，保证发新版后立即生效（expires -1 即 Cache-Control: no-cache）
    location / {
        try_files $uri $uri/ $uri.html /404.html;
        expires -1;
    }

    # Docusaurus 自带的 404 页面
    error_page 404 /404.html;
}
