server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩（wasm 必须在列：Go 演练场的 main.wasm 37MB → 压后约 9MB）
    gzip on;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;

    # 带 hash 的静态资源长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 演练场运行时（Pyodide / Go WASM / Monaco）体积大且很少变，适度缓存
    location ~ ^/(pyodide|go-wasm|monaco)/ {
        # nginx 默认 mime.types 没有 .mjs，会按 octet-stream 下发，
        # 浏览器对 ES Module 脚本强制校验 MIME，Pyodide 会直接加载失败。
        # 注意：location 内的 types 会整体替换继承的类型表，这里要把
        # 这三个目录下出现的后缀全部列全
        types {
            text/javascript js mjs;
            application/wasm wasm;
            application/json json;
            text/css css;
            font/ttf ttf;
            application/zip zip;
        }
        default_type application/octet-stream;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 图片等静态文件适度缓存
    location /img/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # HTML 不缓存，保证发新版后立即生效
    location / {
        try_files $uri $uri/ $uri.html /404.html;
        add_header Cache-Control "no-cache";
    }

    # Docusaurus 自带的 404 页面
    error_page 404 /404.html;
}
