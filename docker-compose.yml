services:
  coding-docs:
    build:
      context: .
      dockerfile: Dockerfile
    image: coding-docs:latest
    container_name: coding-docs
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
