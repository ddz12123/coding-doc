name: Build and Deploy

on:
  push:
    branches: [master]
  workflow_dispatch: # 支持在 Actions 页面手动触发

# 同一时间只跑一条部署流水线，新提交会取消进行中的旧任务
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 不写 version，自动读取 package.json 的 packageManager 字段，保证与本地一致

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22   # pnpm 11 要求 Node >= 22.13
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # 将构建产物 build 目录上传到 EdgeOne Pages（腾讯云边缘节点托管）
      # -n 对应 EdgeOne 控制台的 Pages 项目名，-t 为 API Token
      - name: Deploy to EdgeOne Pages
        run: npx edgeone pages deploy ./build -n coding-doc -t ${{ secrets.EDGEONE_API_TOKEN }}
